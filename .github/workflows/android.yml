name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定签名：从仓库 Secrets 还原签名钥匙（与本地 signing/autoledger.jks 是同一把），
      # 使 CI 构建的 APK 与本地/历史版本签名一致，可覆盖安装升级。
      # Secrets 未设置时仅警告并跳过 —— 构建链不断，但 APK 用临时 debug 钥匙签名
      # （与历史版本不兼容，不能覆盖升级）。
      - name: Restore signing keystore
        env:
          AUTOLEDGER_KEYSTORE_B64: ${{ secrets.AUTOLEDGER_KEYSTORE_BASE64 }}
          AUTOLEDGER_STORE_PASSWORD: ${{ secrets.AUTOLEDGER_STORE_PASSWORD }}
          AUTOLEDGER_KEY_ALIAS: ${{ secrets.AUTOLEDGER_KEY_ALIAS }}
          AUTOLEDGER_KEY_PASSWORD: ${{ secrets.AUTOLEDGER_KEY_PASSWORD }}
        run: |
          if [ -z "$AUTOLEDGER_KEYSTORE_B64" ]; then
            echo "::warning::AUTOLEDGER_KEYSTORE_BASE64 未设置 —— APK 将用临时 debug 钥匙签名（无法覆盖升级）"
            exit 0
          fi
          mkdir -p signing
          echo "$AUTOLEDGER_KEYSTORE_B64" | base64 -d > signing/autoledger.jks
          {
            echo "storeFile=signing/autoledger.jks"
            echo "storePassword=$AUTOLEDGER_STORE_PASSWORD"
            echo "keyAlias=$AUTOLEDGER_KEY_ALIAS"
            echo "keyPassword=$AUTOLEDGER_KEY_PASSWORD"
          } > keystore.properties
          echo "keystore restored (cert fingerprint check):"
          keytool -list -v -keystore signing/autoledger.jks -storepass "$AUTOLEDGER_STORE_PASSWORD" -alias "$AUTOLEDGER_KEY_ALIAS" | grep SHA256:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 显式指定要装的包，避免该 action 默认执行 `sdkmanager tools`——
          # 而 `tools` 包名在新版 cmdline-tools 中已废弃（会报 "Failed to find package 'tools'" 导致 CI 失败）。
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant gradlew executable permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 静态一致性校验：模块、依赖方向、包名、分层、API 泄漏（不依赖 Android SDK）
      - name: Static consistency check
        run: python3 tools/static_check.py

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 全量单测。--rerun-tasks 不可省略：不带该参数时 Gradle 会因 UP-TO-DATE
      # 直接跳过已缓存的任务，测试"通过"可能只是缓存结果，等于没跑。
      - name: Run all unit tests
        run: ./gradlew test --rerun-tasks --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
