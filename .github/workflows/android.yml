name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 显式指定要装的包，避免该 action 默认执行 `sdkmanager tools`——
          # 而 `tools` 包名在新版 cmdline-tools 中已废弃（会报 "Failed to find package 'tools'" 导致 CI 失败）。
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Grant gradlew executable permission
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 静态一致性校验：模块、依赖方向、包名、分层、API 泄漏（不依赖 Android SDK）
      - name: Static consistency check
        run: python3 tools/static_check.py

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 全量单测。--rerun-tasks 不可省略：不带该参数时 Gradle 会因 UP-TO-DATE
      # 直接跳过已缓存的任务，测试"通过"可能只是缓存结果，等于没跑。
      - name: Run all unit tests
        run: ./gradlew test --rerun-tasks --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
