# 正式版签名配置示例 —— 复制本文件为 keystore.properties 并填入真实值。
#
# ⚠️ 重要（务必读完）：
#   安卓要求「同一个应用必须始终用同一把钥匙签名」。这把钥匙一旦丢失，你再也无法
#   覆盖安装升级（只能让用户卸载重装，所有本地账本数据随之丢失）。
#   所以：生成 keystore 后请把它备份到安全的地方，且永远不要把 keystore.properties 提交到仓库。

storeFile=C:/path/to/your/autoledger-release.jks
storePassword=请改成你的store密码
keyAlias=autoledger
keyPassword=请改成你的key密码

# ---- 用 keytool 生成 keystore 的命令（在命令行执行）----
#  keytool -genkey -v -keystore "C:/path/to/your/autoledger-release.jks" \
#    -alias autoledger -keyalg RSA -keysize 2048 -validity 10000
#  按提示填写信息即可；validity 10000 表示约 27 年有效期。
