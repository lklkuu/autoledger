[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
# androidx.core 的版本线：**base(core) 与 ktx(core-ktx) 共用同一个版本号**
# （旧名 coreKtx 易被误读为「只属于 ktx」，已改成语义准确的 androidxCore）。
androidxCore = "1.15.0"
coroutines = "1.9.0"
serialization = "1.7.3"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
# ⚠️ 这是 **lifecycle 家族的版本锚点**（app 用 androidx.lifecycle-runtime-ktx 显式声明它），
# 不是随便挑的版本号：它把 activity-compose 传递进来的 runtime/viewmodel/process/common-java8
# 统一抬到同一版本。下调或删除会让家族里出现 2.4.1/2.6.1/2.6.2/2.8.x 并存并改变 classes.dex。
lifecycle = "2.8.7"
room = "2.6.1"
sqlite = "2.4.0"
sqlcipher = "4.5.5"
material3 = "1.3.1"
robolectric = "4.13"
zxing = "3.5.3"

[libraries]
# androidx.core：base(core) 与 ktx(core-ktx) 同版本线（androidxCore）。
# app / feature:capture 实际只用到 base 包的类（NotificationCompat / NotificationManagerCompat /
# ContextCompat），故直接声明 base 构件；若将来用到 ktx 扩展再引入 androidx-core-ktx。
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }

sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# 生成二维码（捐赠落地页地址 → 二维码图片）
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
